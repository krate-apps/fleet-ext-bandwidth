schema: 1
id: org.fleet.bandwidth
name: Bandwidth Limits
description: Set per-torrent upload and download rate limits on connected clients.
version: 1.0.0
api: ">=1.0.0 <2.0.0"
engines:
  - rtorrent
  - qbittorrent
  - deluge
  - transmission
capabilities:
  - torrents.read
  - torrents.actions
  - storage.read
  - storage.write
frontend:
  type: declarative
  entry: ui/extension.json
backend:
  type: process
  executable: bin/bandwidth-worker
  protocol: jsonrpc-2
